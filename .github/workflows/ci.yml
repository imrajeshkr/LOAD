name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 02:00 UTC daily. The generator sweep reads the exercise catalog, so a
    # data change — promoting a lift to Core, editing min_experience — can
    # break a plan shape without any commit to trigger a run.
    - cron: '0 2 * * *'

jobs:
  flutter:
    name: Analyze, test, interactivity guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # pubspec.yaml ships .env as a Flutter asset and .gitignore excludes it,
      # so a clean checkout fails at "No file or variants found for asset: .env"
      # before any test runs. Placeholders are enough — nothing here talks to
      # Supabase; the SQL job below is what exercises the database.
      - name: Provide placeholder .env
        run: cp .env.example .env

      - run: flutter pub get

      # `flutter analyze` exits non-zero on infos too. The repo currently
      # carries 4 pre-existing infos, so failing on those would make CI red
      # from day one and teach everyone to ignore it. Errors and warnings do
      # fail the build.
      - name: flutter analyze (errors and warnings)
        run: |
          set -o pipefail
          flutter analyze lib 2>&1 | tee analyze.txt || true
          if grep -qE '^\s*(error|warning) •' analyze.txt; then
            echo "::error::analyze reported errors or warnings"
            grep -E '^\s*(error|warning) •' analyze.txt
            exit 1
          fi
          echo "no errors or warnings ($(grep -c '^\s*info •' analyze.txt || echo 0) infos)"

      - run: flutter test

      # Enforces the CLAUDE.md rule that every screen tap goes through
      # Pressable. Cheap, and the whole point is that it does not rely on
      # anyone remembering.
      - name: Interactivity guard
        run: ./tool/check_interactivity.sh

  database:
    name: SQL suites
    runs-on: ubuntu-latest
    # Every suite runs inside a transaction that is always rolled back, so this
    # is safe against the live database. It needs the pooler password, so it is
    # skipped on forks and until the secret exists rather than failing red.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Run every suite
        env:
          LOAD_SUPABASE_DB_PASSWORD: ${{ secrets.LOAD_SUPABASE_DB_PASSWORD }}
        run: |
          echo "HAS_SECRET=$([ -n "$LOAD_SUPABASE_DB_PASSWORD" ] && echo true || echo false)" >> "$GITHUB_ENV"
          if [ -z "$LOAD_SUPABASE_DB_PASSWORD" ]; then
            # A green check that ran nothing is worse than no check, so say it
            # loudly in the job summary rather than only in a log line.
            {
              echo "### SQL suites did not run"
              echo
              echo "\`LOAD_SUPABASE_DB_PASSWORD\` is not set, so all"
              echo "\`supabase/tests/*_test.sql\` were **skipped** — this check"
              echo "is green but verified nothing."
              echo
              echo "Add the secret under **Settings → Secrets and variables →"
              echo "Actions** to enable them."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::SQL suites skipped — LOAD_SUPABASE_DB_PASSWORD not set"
            exit 0
          fi
          printf 'LOAD_SUPABASE_DB_PASSWORD=%s\n' "$LOAD_SUPABASE_DB_PASSWORD" > .env
          fail=0
          for t in supabase/tests/*_test.sql; do
            printf '%-44s ' "$(basename "$t")"
            if out=$(./tool/db_test.sh "$t" 2>&1) && ! echo "$out" | grep -q 'ERROR'; then
              echo pass
            else
              echo FAIL; echo "$out" | grep 'ERROR' | head -3; fail=1
            fi
          done
          exit $fail

      # Runs in ~18s against the live catalog, so there is no reason to keep it
      # out of the pipeline. Kept as its own step because a failure here means
      # something quite different from a suite failure: not "this behaviour
      # broke" but "some combination of inputs no longer produces a usable
      # plan".
      - name: Generator coverage sweep (275 plan shapes)
        if: env.HAS_SECRET == 'true'
        env:
          LOAD_SUPABASE_DB_PASSWORD: ${{ secrets.LOAD_SUPABASE_DB_PASSWORD }}
        run: |
          printf 'LOAD_SUPABASE_DB_PASSWORD=%s\n' "$LOAD_SUPABASE_DB_PASSWORD" > .env
          out=$(./tool/db_test.sh supabase/tests/v2_matrix_sweep.sql 2>&1)
          rm -f .env
          echo "$out" | grep -E 'FAIL|swept|SWEEP' | sed 's/.*NOTICE:  //'
          echo "$out" | grep -q 'ERROR' && exit 1 || exit 0
